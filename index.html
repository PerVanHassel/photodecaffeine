
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <!-- viewport-fit=cover lets the admin app paint into the iPhone safe areas;
           it is inert on the public site, which never reads env(safe-area-*). -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>PhotoDeCaffeine</title>

      <!-- PWA manifest for the admin app. Its scope is /app, so browsers only
           offer installation there — the marketing pages are unaffected. The
           iOS-specific standalone tags are injected at runtime by the app shell
           (src/app/mobile/pwa.ts) for the same reason. -->
      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <meta name="description" content="Automotive fotografie, videografie en social media beheer door heel Nederland. Voor auto's, motoren en de mensen erachter — zakelijk en particulier." />
      <meta name="robots" content="index, follow" />

      <!-- Open Graph — fallback (per-page Helmet overrides these) -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="PhotoDeCaffeine" />
      <meta property="og:title" content="Automotive Fotografie & Social Media Beheer | PhotoDeCaffeine" />
      <meta property="og:description" content="Professionele automotive fotografie, videografie en social media beheer door heel Nederland. Auto's, motoren, bedrijven en particulieren." />
      <meta property="og:url" content="https://www.photodecaffeine.com/" />
      <meta property="og:image" content="https://www.photodecaffeine.com/og-image.jpg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:locale" content="nl_NL" />

      <!-- Twitter / X Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Automotive Fotografie & Social Media Beheer | PhotoDeCaffeine" />
      <meta name="twitter:description" content="Professionele automotive fotografie, videografie en social media beheer door heel Nederland." />
      <meta name="twitter:image" content="https://www.photodecaffeine.com/og-image.jpg" />

      <!-- Plausible Analytics — cookievrij, privacyvriendelijk -->
      <script defer data-domain="photodecaffeine.com" src="https://plausible.io/js/script.js"></script>

      <!-- Structured data: LocalBusiness -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["LocalBusiness", "Photographer"],
        "name": "PhotoDeCaffeine",
        "description": "Automotive fotografie, videografie en social media beheer door heel Nederland. Voor auto's, motoren en de mensen erachter — zakelijk en particulier.",
        "url": "https://www.photodecaffeine.com",
        "email": "contact@photodecaffeine.com",
        "image": "https://www.photodecaffeine.com/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Middenstraat 47",
          "addressLocality": "Roosendaal",
          "addressRegion": "Noord-Brabant",
          "addressCountry": "NL"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 51.5364,
          "longitude": 4.4653
        },
        "areaServed": "Nederland",
        "priceRange": "€€",
        "currenciesAccepted": "EUR",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Diensten",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Automotive Fotografie",
                "description": "Professionele fotografie van auto's en motoren voor showrooms, dealers en particuliere eigenaren. Vanaf €50."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Social Media Beheer",
                "description": "Content en social media beheer voor autobedrijven, dealers en particuliere eigenaren."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Studio Fotografie",
                "description": "Studio- en editorial shoots voor merken en particulieren."
              }
            }
          ]
        },
        "sameAs": [
          "https://www.instagram.com/photodecaffeine"
        ]
      }
      </script>

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
