
  <!DOCTYPE html>
  <html lang="nl">
    <head>
      
      <meta charset="UTF-8" />
      <!-- viewport-fit=cover lets the admin app paint into the iPhone safe areas;
           it is inert on the public site, which never reads env(safe-area-*). -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>PhotoDeCaffeine</title>

      <!-- PWA manifest for the admin app. Its scope is /app, so browsers only
           offer installation there — the marketing pages are unaffected. The
           iOS-specific standalone tags are injected at runtime by the app shell
           (src/app/mobile/pwa.ts) for the same reason. -->
      <!-- Fonts and photos come from these hosts; connect early instead of after
           the CSS and the data have been read. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="preconnect" href="https://uunwhesmymkwmkgqkmxy.supabase.co" />
      <link rel="preconnect" href="https://uunwhesmymkwmkgqkmxy.supabase.co" crossorigin />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />

      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <meta name="description" content="Automotive fotografie, videografie en social media beheer door heel Nederland. Voor auto's, motoren en de mensen erachter — zakelijk en particulier." />
      <meta name="robots" content="index, follow" />

      <!-- Open Graph — fallback (per-page Helmet overrides these) -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="PhotoDeCaffeine" />
      <meta property="og:title" content="Automotive fotografie & social media beheer | PhotoDeCaffeine" />
      <meta property="og:description" content="Professionele automotive fotografie, videografie en social media beheer door heel Nederland. Auto's, motoren, bedrijven en particulieren." />
      <meta property="og:url" content="https://www.photodecaffeine.com/" />
      <!-- The hero photo from the site settings, refreshed at build time by
           scripts/seo.mjs. It used to point at /og-image.jpg, a file that was
           never in the repo, so every share showed no image at all. No
           width/height here: the photo's dimensions change with the hero, and
           platforms read them from the file anyway. -->
      <meta property="og:image" content="https://uunwhesmymkwmkgqkmxy.supabase.co/storage/v1/object/public/portfolio-images-0951c59e/web/1780794457379-bikersoul-041-2560.jpg" />
      <meta property="og:locale" content="nl_NL" />

      <!-- Twitter / X Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Automotive fotografie & social media beheer | PhotoDeCaffeine" />
      <meta name="twitter:description" content="Professionele automotive fotografie, videografie en social media beheer door heel Nederland." />
      <meta name="twitter:image" content="https://uunwhesmymkwmkgqkmxy.supabase.co/storage/v1/object/public/portfolio-images-0951c59e/web/1780794457379-bikersoul-041-2560.jpg" />

      <!-- Plausible Analytics — cookievrij, privacyvriendelijk -->
      <script defer data-domain="photodecaffeine.com" src="https://plausible.io/js/script.js"></script>
      <!-- Queues custom events (src/app/lib/analytics.ts) until the script above has loaded. -->
      <script>window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>

      <!-- Structured data: LocalBusiness -->

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
