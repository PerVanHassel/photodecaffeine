name: Deploy edge function

# The function is deployed from CI rather than by hand: the source is ~140 KB,
# which is too large to paste anywhere, and a half-finished upload once took
# the API down. Pushing to main is now the only thing needed.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy make-server-0951c59e
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ontbreekt. Voeg hem toe onder Settings > Secrets and variables > Actions."
            exit 1
          fi
          supabase functions deploy make-server-0951c59e --project-ref uunwhesmymkwmkgqkmxy
