name: Deploy edge function

# The function is deployed from CI rather than by hand: the source is ~140 KB,
# which is too large to paste anywhere, and a half-finished upload once took
# the API down. Pushing to main is now the only thing needed.
on:
  push:
    branches: [main]
    paths:
      # config.toml sits beside functions/, not inside it, and the deploy
      # depends on it — a narrower filter silently skipped changes to it.
      - "supabase/**"
      - ".github/workflows/deploy-edge-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Says which mistake was made instead of only that the token is missing.
      # The token is never printed — only its length and where it was found.
      - name: Check the access token
        env:
          FROM_SECRET: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FROM_VARIABLE: ${{ vars.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$FROM_SECRET" ]; then
            echo "Gevonden als repository secret (${#FROM_SECRET} tekens)."
            exit 0
          fi
          if [ -n "$FROM_VARIABLE" ]; then
            echo "::error::De naam staat onder 'Variables' in plaats van 'Secrets'. Verwijder hem daar en voeg hem toe onder het tabblad Secrets — een token hoort niet in een variable, die is leesbaar."
            exit 1
          fi
          echo "::error::SUPABASE_ACCESS_TOKEN is leeg. Controleer op https://github.com/PerVanHassel/photodecaffeine/settings/secrets/actions of er onder 'Repository secrets' een regel SUPABASE_ACCESS_TOKEN staat, exact zo geschreven."
          exit 1

      - name: Deploy make-server-0951c59e
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy make-server-0951c59e --project-ref uunwhesmymkwmkgqkmxy
